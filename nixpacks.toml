# Nixpacks configuration for ZOBBRA Backend API
[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "openssl_1_1"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.0.0 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = ["pnpm run db:generate", "pnpm --filter zobra-server build"]

[start]
cmd = "pnpm --filter zobra-server start"
