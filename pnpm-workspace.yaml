packages:
  - "apps/*"
  - "packages/*"
  - "server"


allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  cypress: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "cypress"
  - "@scarf/scarf"
